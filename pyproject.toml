[project]
name = "llmchat"
version = "0.1.0"
description = "Rich-rendered REPL wrapper around the llm library."
requires-python = ">=3.11"
dependencies = [
    "llm>=0.20",
    "rich>=13.7",
    "prompt-toolkit>=3.0",
]

[project.scripts]
llmchat = "llmchat:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llmchat"]
